workflows:
  ios-check:
    name: Villa Maria Golf - comprobar iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Preparar dependencias y pantallas
        script: |
          set -e
          cd mobile
          npm install --no-audit --no-fund
          npm run build
          npm run check
          npx cap sync ios
      - name: Compilar para simulador de iPhone
        script: |
          set -e
          cd mobile
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/App.app build/VillaMariaGolf-simulador.zip
    artifacts:
      - mobile/build/VillaMariaGolf-simulador.zip
