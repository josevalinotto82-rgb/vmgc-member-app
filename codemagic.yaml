workflows:
  android-preview:
    name: Villa Maria Golf - Android prueba
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Preparar Android
        script: |
          set -e
          cd mobile
          npm install --no-audit --no-fund
          npm run build
          npm run check
          npx cap sync android
      - name: Generar APK de prueba
        script: |
          set -e
          cd mobile/android
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
  android-google-play:
    name: Villa Maria Golf - Android Google Play
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      android_signing:
        - vmgc-android-upload
    scripts:
      - name: Preparar Android
        script: |
          set -e
          cd mobile
          npm install --no-audit --no-fund
          npm run build
          npm run check
          npx cap sync android
      - name: Generar APK y AAB firmados
        script: |
          set -e
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEY_ALIAS"
          cd mobile/android
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - mobile/android/app/build/outputs/apk/release/*.apk
      - mobile/android/app/build/outputs/bundle/release/*.aab
  ios-check:
    name: Villa Maria Golf - comprobar iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Preparar dependencias y pantallas
        script: |
          set -e
          cd mobile
          npm install --no-audit --no-fund
          npm run build
          npm run check
          npx cap sync ios
      - name: Compilar para simulador de iPhone
        script: |
          set -e
          cd mobile
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/App.app build/VillaMariaGolf-simulador.zip
    artifacts:
      - mobile/build/VillaMariaGolf-simulador.zip
  ios-testflight:
    name: Villa Maria Golf - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Codemagic VMGC
    environment:
      xcode: 26.2
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ar.com.villamariagolf.members
    scripts:
      - name: Preparar app
        script: |
          set -e
          cd mobile
          npm install --no-audit --no-fund
          npm run build
          npm run check
          npx cap sync ios
      - name: Configurar firma y numero de compilacion
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          cd mobile
          xcode-project use-profiles
          cd ios/App
          agvtool new-version -all "$((BUILD_NUMBER + 1))"
      - name: Generar IPA
        script: |
          set -e
          cd mobile
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
