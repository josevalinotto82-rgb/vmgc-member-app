<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Confirmar ingreso - Villa María Golf</title>
  <link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="shared-back.css?v=1">
<script defer src="shared-back.js?v=1"></script>
</head>
<body>
  <div class="card">
    <h2>Confirmación de tu cuenta</h2>
    <p id="msg" role="status">Estamos confirmando tu ingreso…</p>
    <a href="login.html">Volver al ingreso</a>
  </div>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const client=createClient("https://bnnfolhrqxgxjmobclrm.supabase.co","sb_publishable_pNxU4AFpAZPpeJ0wICLvIw_6nW90njQ",{auth:{detectSessionInUrl:false}});
    const params=new URLSearchParams(location.search);
    const code=params.get('code');
    history.replaceState({},document.title,location.pathname);
    try {
      if(!code || params.has('error_code'))throw new Error();
      const {error}=await client.auth.exchangeCodeForSession(code);
      if(error)throw error;
      location.replace('panel.html');
    } catch {
      document.getElementById('msg').textContent='No pudimos completar el ingreso con este enlace. Si ya confirmaste tu correo, volvé al ingreso y usá tu email y contraseña. Si el enlace venció, solicitá uno nuevo.';
    }
  </script>
</body>
</html>
